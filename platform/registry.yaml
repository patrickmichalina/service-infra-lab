# Platform-owned: which repository owns which service, and for which team.
# In platform-gitops this is sharded per team (teams/<team>/services.yaml) with that
# team's leads as CODEOWNERS, so a team registers a new service without the platform team.
# The spec cannot choose its team: the renderer reads it from here, keyed by the repository
# the spec came from (the CI job's own project path, not anything the spec says).
services:
  odds-ingest:       {team: ingestion,     repo: example-org/odds-ingest}
  settlement-writer: {team: state,         repo: example-org/settlement-writer}
  rfq-router:        {team: normalization, repo: example-org/rfq-router}
  trader-ui:         {team: distribution,  repo: example-org/trader-ui}
