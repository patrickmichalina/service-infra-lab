# Objects that must be refused at admission, whoever applies them. Each is an attack
# from the adversarial pass (docs/notes.md) or a shape R1, R2 or R4 forbids. Written for
# the stg cluster (params/stg.yaml); test.sh checks every one is refused.
# empty podSelector with rules: widens the whole namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: np-empty-selector, namespace: normalization}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}], ports: [{port: 8080}]}]

---
# ingress from every namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: np-any-namespace, namespace: normalization}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  ingress: [{from: [{namespaceSelector: {}}], ports: [{port: 8080}]}]

---
# internet egress on every port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: np-internet-all-ports, namespace: normalization}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  egress: [{to: [{ipBlock: {cidr: 0.0.0.0/0, except: [10.20.0.0/16]}}]}]

---
# a literal address outside the VPC
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: np-literal-external, namespace: distribution}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  egress: [{to: [{ipBlock: {cidr: 203.0.113.40/32}}], ports: [{port: 443, protocol: TCP}]}]

---
# b1: ingress from the whole internet
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: b1-ingress-from-internet, namespace: ingestion}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  ingress: [{from: [{ipBlock: {cidr: 0.0.0.0/0}}], ports: [{port: 8080}]}]

---
# b2: egress to every namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: b2-egress-all-namespaces, namespace: ingestion}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  egress: [{to: [{namespaceSelector: {}}], ports: [{port: 8080}]}]

---
# b3: stg egress to the prd VPC
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: b3-stg-to-prd-vpc, namespace: ingestion}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  egress: [{to: [{ipBlock: {cidr: 10.30.0.0/16}}], ports: [{port: 9098}]}]

---
# b4: egress to all of 10.0.0.0/8
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: b4-ten-slash-8, namespace: ingestion}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  egress: [{to: [{ipBlock: {cidr: 10.0.0.0/8}}], ports: [{port: 9098}]}]

---
# b5: a selector widened by matchExpressions
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: b5-selector-exists, namespace: ingestion}
spec:
  podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: Exists}], matchLabels: {app.kubernetes.io/name: x}}
  egress: [{to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: state}}}], ports: [{port: 9090}]}]

---
# b9: allow-all in a namespace nobody labelled
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: b9-unlabelled-namespace, namespace: sandbox}
spec:
  podSelector: {}
  ingress: [{}]
  egress: [{}]

---
# a rule without ports opens every port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rule-without-ports, namespace: ingestion}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]}]

---
# an egress rule without to reaches everywhere
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rule-without-peers, namespace: ingestion}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  egress: [{ports: [{port: 443}]}]

---
# a port range
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: port-range, namespace: ingestion}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  egress: [{to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: state}}}], ports: [{port: 1, endPort: 65535}]}]

---
# a namespaceSelector naming every namespace but one
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: selector-with-expressions, namespace: ingestion}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  egress: [{to: [{namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system]}]}}], ports: [{port: 8080}]}]

---
# internet egress without the hosts annotation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: internet-without-hosts, namespace: ingestion}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: odds-ingest}}
  egress: [{to: [{ipBlock: {cidr: 0.0.0.0/0, except: [10.20.0.0/16]}}], ports: [{port: 443, protocol: TCP}]}]

---
# internet egress that does not exclude this VPC
apiVersion: networking.k8s.io/v1
