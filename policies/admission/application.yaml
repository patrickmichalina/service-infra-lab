# Backstop for R1 at admission: an Application the renderer produces for a team
# deploys only under that team's project (or the platform's infra project) and
# only into that team's namespace. Nothing labelled for a team reaches default.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: service-application
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["applications"]
  matchConditions:
    - name: rendered-for-a-team
      expression: "has(object.metadata.labels) && 'platform.example.org/team' in object.metadata.labels"
  variables:
    - name: team
      expression: "object.metadata.labels['platform.example.org/team']"
  validations:
    - expression: "object.spec.project == variables.team || object.spec.project == 'services-infra'"
      message: "a team's Application must use the team's Argo CD project (R1)"
    - expression: "object.spec.destination.namespace == variables.team"
      message: "a team's Application deploys only into the team's namespace (R1)"
