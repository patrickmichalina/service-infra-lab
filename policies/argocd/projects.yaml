apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: services-infra, namespace: argocd}
spec:
  description: Objects svcrender rendered from service specs, applied from platform-gitops only
  sourceRepos: ["https://git.example.org/platform-gitops.git"]
  destinations:
    - {server: https://kubernetes.default.svc, namespace: ingestion}
    - {server: https://kubernetes.default.svc, namespace: state}
    - {server: https://kubernetes.default.svc, namespace: normalization}
    - {server: https://kubernetes.default.svc, namespace: distribution}
    - {server: https://kubernetes.default.svc, namespace: ack-services}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: ServiceAccount}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: iam.services.k8s.aws, kind: Role}
    - {group: eks.services.k8s.aws, kind: PodIdentityAssociation}
