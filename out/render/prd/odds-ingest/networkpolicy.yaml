apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    platform.example.org/spec-digest: sha256:1f5062540eaaac799f2481c55e870ebcc170c038052a4b4fe60cc67869805874
  labels:
    app.kubernetes.io/managed-by: svcrender
    app.kubernetes.io/name: odds-ingest
    platform.example.org/team: ingestion
  name: odds-ingest
  namespace: ingestion
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.170.23/32
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.30.0.0/16
    - ports:
        - port: 9098
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.30.0.0/16
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: odds-ingest
  policyTypes:
    - Ingress
    - Egress
