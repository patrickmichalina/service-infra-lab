apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    platform.example.org/spec-digest: sha256:472fad0f8fdd7e00588416ce17b516ff144258ba0e50693c420a5b2895410ea5
  labels:
    app.kubernetes.io/managed-by: svcrender
    app.kubernetes.io/name: rfq-router
    platform.example.org/team: normalization
  name: rfq-router
  namespace: normalization
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.170.23/32
    - ports:
        - port: 9098
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.30.0.0/16
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.30.0.0/16
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: normalization
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rfq-router
  policyTypes:
    - Ingress
    - Egress
