apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    platform.example.org/egress-hosts: '*.s3.us-east-1.amazonaws.com,s3.us-east-1.amazonaws.com'
    platform.example.org/spec-digest: sha256:bccc0342aa1a5459bef2dabe71c509dd750f19ba290d5a866a74b8279e5f7928
  labels:
    app.kubernetes.io/managed-by: svcrender
    app.kubernetes.io/name: settlement-writer
    platform.example.org/team: state
  name: settlement-writer
  namespace: state
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.170.23/32
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.30.0.0/16
    - ports:
        - port: 9098
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.30.0.0/16
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.30.0.0/16
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: distribution
      ports:
        - port: 9090
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: settlement-writer
  policyTypes:
    - Ingress
    - Egress
