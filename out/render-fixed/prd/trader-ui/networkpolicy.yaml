apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    platform.example.org/egress-hosts: '*.s3.us-east-1.amazonaws.com,login.auth-provider.example,s3.us-east-1.amazonaws.com'
    platform.example.org/spec-digest: sha256:2456c6d5883d7ccdae0b712ae9709f04d016fabe8fb5b9df415a3b7f489ac0fd
  labels:
    app.kubernetes.io/managed-by: svcrender
    app.kubernetes.io/name: trader-ui
    platform.example.org/team: distribution
  name: trader-ui
  namespace: distribution
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.170.23/32
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.30.0.0/16
    - ports:
        - port: 9090
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: state
  ingress:
    - from:
        - ipBlock:
            cidr: 10.30.240.0/24
        - ipBlock:
            cidr: 10.30.241.0/24
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trader-ui
  policyTypes:
    - Ingress
    - Egress
