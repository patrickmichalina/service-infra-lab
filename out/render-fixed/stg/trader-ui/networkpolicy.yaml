apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    platform.example.org/spec-digest: sha256:6314a8b8a10dc6fec6da3f59d79b5ff53fe9c2a4065742486c3c392de3991708
  labels:
    app.kubernetes.io/managed-by: svcrender
    app.kubernetes.io/name: trader-ui
    platform.example.org/team: distribution
  name: trader-ui
  namespace: distribution
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.170.23/32
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.20.0.0/16
    - ports:
        - port: 9090
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: state
  ingress:
    - from:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trader-ui
  policyTypes:
    - Ingress
    - Egress
