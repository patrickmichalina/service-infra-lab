name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))"
      - run: go vet ./...
      - run: go test ./...
      - name: committed outputs are what the code produces
        run: |
          go run ./cmd/svcrender all -specs specs -out out/render
          go run ./cmd/svcrender all -specs specs/fixed -out out/render-fixed
          go run ./cmd/soakgate > out/promotion/verdicts.txt
          git diff --exit-code out/
